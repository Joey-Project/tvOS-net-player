[package]
name = "tvos-net-player-cache-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["http1", "tokio"] }
base64 = "0.22.1"
futures-core = "0.3.31"
http = "1.3.1"
httpdate = "1.0.3"
libc = "0.2.178"
prost = "0.14.3"
prost-types = "0.14.1"
serde_json = "1.0.145"
socket2 = "0.6.4"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { version = "1.19.0", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "rustls-tls"] }
tempfile = "3.23.0"
