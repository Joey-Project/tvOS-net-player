name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-platforms:
    name: tvOS build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Run pre-commit checks
        run: scripts/pre-commit.sh

      - name: Build tvOS simulator app
        run: scripts/build.sh

      - name: Build macOS app
        run: scripts/build-macos.sh

      - name: Build LAN cache server
        run: scripts/build-cache-server.sh

      - name: Build tvOS XCTest bundle
        run: scripts/build-for-testing.sh

      - name: Run tvOS XCTest target
        run: scripts/test-tvos-simulator.sh

      - name: Run core unit tests
        run: scripts/test.sh

      - name: Run macOS XCTest target
        run: scripts/test-macos.sh

      - name: Run LAN cache server integration tests
        run: scripts/test-cache-server.sh
