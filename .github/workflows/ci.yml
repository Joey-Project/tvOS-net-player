name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-platforms:
    name: Apple platform build and tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Establish CI work deadline
        run: |
          deadline="$(python3 -c 'import time; print(time.monotonic() + 45 * 60)')"
          printf 'CI_WORK_DEADLINE_MONOTONIC=%s\n' "$deadline" >> "$GITHUB_ENV"
          printf 'CI_STAGE_ARTIFACT_DIR=%s/ci-stage-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        timeout-minutes: 3
        run: |
          python3 scripts/ci-stage.py --stage toolchain-apple --timeout-seconds 120 -- bash -e -o pipefail -c '
            xcodebuild -version
            xcodebuild -showsdks
          '

      - name: Install shellcheck
        timeout-minutes: 6
        run: |
          python3 scripts/ci-stage.py --stage install-shellcheck --timeout-seconds 300 -- bash -e -o pipefail -c '
            if ! command -v shellcheck >/dev/null 2>&1; then
              brew install shellcheck
            fi
          '

      - name: Show Rust toolchain
        timeout-minutes: 3
        run: |
          python3 scripts/ci-stage.py --stage toolchain-rust --timeout-seconds 120 -- bash -e -o pipefail -c '
            rustc --version
            cargo --version
            cargo clippy --version
          '

      - name: Compute compiled cache identities
        id: cache-toolchains
        timeout-minutes: 2
        continue-on-error: true
        run: |
          apple="$(xcodebuild -version)"
          swift="$(xcrun swift --version)"
          sdks="$(xcodebuild -showsdks)"
          clang="$(xcrun clang --version)"
          os="$(sw_vers -buildVersion)"
          rust="$(rustc -Vv)"
          cargo="$(cargo -V)"
          apple_key="$(printf '%s\n' "$apple" "$swift" "$sdks" "$clang" "$os" | shasum -a 256 | cut -d ' ' -f 1)"
          rust_key="$(printf '%s\n' "$apple_key" "$rust" "$cargo" | shasum -a 256 | cut -d ' ' -f 1)"
          printf 'swift=%s\nrust=%s\n' "$apple_key" "$rust_key" >> "$GITHUB_OUTPUT"

      - name: Restore Rust compiled cache
        id: restore-rust
        if: steps.cache-toolchains.outputs.rust != ''
        uses: actions/cache/restore@v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: target
          key: ci-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchains.outputs.rust }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'CacheServer/RustCacheServer/Cargo.toml', 'CacheServer/RustCacheServer/build.rs', 'CacheServer/RustCacheServer/src/**', 'CacheServer/RustCacheServer/tests/**', 'Sources/TVOSNetPlayerCacheClient/Protos/**', 'scripts/build-cache-server.sh', 'scripts/test-cache-server.sh', 'scripts/lint-rust.sh') }}

      - name: Run CI helper regression tests
        run: python3 scripts/ci-stage.py --stage helper-regressions -- python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run pre-commit checks
        run: python3 scripts/ci-stage.py --stage pre-commit -- scripts/pre-commit.sh

      - name: Build tvOS simulator app
        run: python3 scripts/ci-stage.py --stage tvos-build -- scripts/build.sh

      - name: Build macOS app
        run: python3 scripts/ci-stage.py --stage macos-build -- scripts/build-macos.sh

      - name: Build LAN cache server
        run: python3 scripts/ci-stage.py --stage rust-build -- scripts/build-cache-server.sh

      - name: Build tvOS XCTest bundle
        run: python3 scripts/ci-stage.py --stage tvos-test-build -- scripts/build-for-testing.sh

      - name: Run tvOS XCTest target
        run: python3 scripts/ci-stage.py --stage tvos-tests -- scripts/test-tvos-simulator.sh

      - name: Run macOS XCTest target
        run: python3 scripts/ci-stage.py --stage macos-tests -- scripts/test-macos.sh

      - name: Build and self-test LAN AVPlayer probe
        run: python3 scripts/ci-stage.py --stage lan-probe -- bash scripts/test-lan-playback.sh

      - name: Run LAN cache server integration tests
        run: python3 scripts/ci-stage.py --stage rust-tests -- scripts/test-cache-server.sh

      - name: Summarize bounded CI diagnostics
        if: always()
        timeout-minutes: 1
        env:
          CI_RUST_CACHE_OUTCOME: ${{ steps.restore-rust.outcome }}
          CI_RUST_CACHE_HIT: ${{ steps.restore-rust.outputs.cache-hit }}
        run: python3 scripts/ci-stage.py --summarize --summary-group apple

      - name: Upload bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: ci-stages-${{ github.run_id }}
          path: |
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/toolchain-apple.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/toolchain-apple.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/install-shellcheck.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/install-shellcheck.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/toolchain-rust.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/toolchain-rust.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/helper-regressions.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/helper-regressions.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/pre-commit.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/pre-commit.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-build.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-build.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/macos-build.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/macos-build.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/rust-build.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/rust-build.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-test-build.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-test-build.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-tests.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/tvos-tests.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/macos-tests.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/macos-tests.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/lan-probe.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/lan-probe.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/rust-tests.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/rust-tests.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/summary.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save Rust compiled cache
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-rust.outputs.cache-primary-key != '' && steps.restore-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: target
          key: ${{ steps.restore-rust.outputs.cache-primary-key }}

  core-unit-tests:
    name: Core unit tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Establish CI work deadline
        run: |
          deadline="$(python3 -c 'import time; print(time.monotonic() + 45 * 60)')"
          printf 'CI_WORK_DEADLINE_MONOTONIC=%s\n' "$deadline" >> "$GITHUB_ENV"
          printf 'CI_STAGE_ARTIFACT_DIR=%s/ci-stage-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute Swift compiled cache identity
        id: cache-swift-toolchain
        timeout-minutes: 2
        continue-on-error: true
        run: |
          apple="$(xcodebuild -version)"
          swift="$(xcrun swift --version)"
          sdks="$(xcodebuild -showsdks)"
          clang="$(xcrun clang --version)"
          os="$(sw_vers -buildVersion)"
          printf 'Apple:\n%s\nSwift:\n%s\nSDKs:\n%s\nClang:\n%s\nmacOS build: %s\n' \
            "$apple" "$swift" "$sdks" "$clang" "$os"
          apple_key="$(printf '%s\n' "$apple" "$swift" "$sdks" "$clang" "$os" | shasum -a 256 | cut -d ' ' -f 1)"
          printf 'swift=%s\n' "$apple_key" >> "$GITHUB_OUTPUT"

      - name: Restore Swift compiled cache
        id: restore-swift
        if: steps.cache-swift-toolchain.outputs.swift != ''
        uses: actions/cache/restore@v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .build
          key: ci-swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-swift-toolchain.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Vendor/**', 'Sources/**', 'Tests/**', 'scripts/test.sh', 'scripts/ui-e2e.py') }}

      - name: Run core unit tests
        run: python3 scripts/ci-stage.py --stage core-tests -- scripts/test.sh

      - name: Summarize bounded core CI diagnostics
        if: always()
        timeout-minutes: 1
        env:
          CI_SWIFT_CACHE_OUTCOME: ${{ steps.restore-swift.outcome }}
          CI_SWIFT_CACHE_HIT: ${{ steps.restore-swift.outputs.cache-hit }}
        run: python3 scripts/ci-stage.py --summarize --summary-group core

      - name: Upload bounded core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: ci-core-stages-${{ github.run_id }}
          path: |
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/core-tests.log
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/core-tests.json
            ${{ env.CI_STAGE_ARTIFACT_DIR }}/summary.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save Swift compiled cache
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-swift.outputs.cache-primary-key != '' && steps.restore-swift.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: .build
          key: ${{ steps.restore-swift.outputs.cache-primary-key }}

  media-network:
    name: Native media network acceptance
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - name: Establish native media work deadline
        run: |
          deadline="$(python3 -c 'import time; print(time.monotonic() + 60 * 60)')"
          printf 'MEDIA_NETWORK_E2E_JOB_WORK_DEADLINE_MONOTONIC=%s\n' "$deadline" >> "$GITHUB_ENV"
          printf 'MEDIA_NETWORK_E2E_ARTIFACT_DIR=%s/media-network-e2e-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out native media repository
        uses: actions/checkout@v4

      - name: Compute native media cache identity
        id: media-toolchain
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          capture_version() {
            local LC_ALL=C output
            if ! output="$("$@" 2>&1 | head -c 65537)"; then
              printf 'Could not read bounded version output for %s.\n' "$1" >&2
              exit 1
            fi
            if [[ ${#output} -gt 65536 ]]; then
              printf 'Version output exceeded its 64 KiB bound for %s.\n' "$1" >&2
              exit 1
            fi
            printf '%s' "$output"
          }
          apple="$(capture_version xcodebuild -version)"
          swift="$(capture_version xcrun swift --version)"
          sdks="$(capture_version xcodebuild -showsdks)"
          clang="$(capture_version xcrun clang --version)"
          os="$(capture_version sw_vers -buildVersion)"
          rust="$(capture_version rustc -Vv)"
          cargo="$(capture_version cargo -V)"
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          printf 'Apple toolchain:\n%s\nSwift:\n%s\nApple SDKs:\n%s\nClang:\n%s\nmacOS build:\n%s\nRust:\n%s\nCargo:\n%s\n' \
            "$apple" "$swift" "$sdks" "$clang" "$os" "$rust" "$cargo"
          toolchain="$(printf '%s\n' "$apple" "$swift" "$sdks" "$clang" "$os" "$rust" "$cargo" | shasum -a 256 | cut -d ' ' -f 1)"
          printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"

      - name: Run native media helper regressions
        timeout-minutes: 3
        run: python3 -m unittest discover -s scripts -p 'test_media_network*.py' -v

      - name: Restore native media Rust cache
        id: restore-media-rust
        if: steps.media-toolchain.outputs.toolchain != ''
        uses: actions/cache/restore@v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: target
          key: media-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.media-toolchain.outputs.toolchain }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'CacheServer/RustCacheServer/Cargo.toml', 'CacheServer/RustCacheServer/build.rs', 'CacheServer/RustCacheServer/src/**', 'CacheServer/RustCacheServer/tests/**', 'Sources/TVOSNetPlayerCacheClient/Protos/**', 'scripts/local_build.py', 'scripts/media-network-e2e.py', 'scripts/test_media_network_e2e.py', 'scripts/probe-lan-playback.swift') }}

      - name: Run native media network acceptance
        timeout-minutes: 52
        run: python3 scripts/media-network-e2e.py --ci-unsigned --artifact-dir "$MEDIA_NETWORK_E2E_ARTIFACT_DIR"

      - name: Summarize native media cache result
        if: always()
        timeout-minutes: 1
        env:
          MEDIA_RUST_CACHE_OUTCOME: ${{ steps.restore-media-rust.outcome }}
          MEDIA_RUST_CACHE_HIT: ${{ steps.restore-media-rust.outputs.cache-hit }}
        run: |
          printf 'Native media Rust cache: outcome=%s hit=%s\n' "${MEDIA_RUST_CACHE_OUTCOME:-unknown}" "${MEDIA_RUST_CACHE_HIT:-unknown}"
          {
            printf '### Native media cache\n\n'
            printf -- '- Restore outcome: %s\n' "${MEDIA_RUST_CACHE_OUTCOME:-unknown}"
            printf -- '- Cache hit: %s\n' "${MEDIA_RUST_CACHE_HIT:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native media acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: media-network-e2e-${{ github.run_id }}
          path: ${{ env.MEDIA_NETWORK_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 3

      - name: Save native media Rust cache
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-media-rust.outputs.cache-primary-key != '' && steps.restore-media-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: target
          key: ${{ steps.restore-media-rust.outputs.cache-primary-key }}

  tvos-build-and-tests:
    name: tvOS build and tests
    needs: [apple-platforms, core-unit-tests, media-network]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CI jobs to succeed
        env:
          APPLE_RESULT: ${{ needs.apple-platforms.result }}
          CORE_RESULT: ${{ needs.core-unit-tests.result }}
          MEDIA_RESULT: ${{ needs.media-network.result }}
        run: |
          if [[ "$APPLE_RESULT" != "success" || "$CORE_RESULT" != "success" || "$MEDIA_RESULT" != "success" ]]; then
            printf 'Required CI jobs did not all succeed (apple=%s, core=%s, media=%s).\n' "$APPLE_RESULT" "$CORE_RESULT" "$MEDIA_RESULT" >&2
            exit 1
          fi
