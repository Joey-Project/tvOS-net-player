name: UI E2E

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    name: ${{ matrix.platform }} UI playback E2E
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, tvos]
    steps:
      - name: Establish UI E2E work deadline
        run: |
          deadline="$(python3 -c 'import time; print(time.monotonic() + 45 * 60)')"
          printf 'UI_E2E_JOB_WORK_DEADLINE_MONOTONIC=%s\n' "$deadline" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record installed Apple toolchain
        timeout-minutes: 2
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Record installed tvOS runtimes and devices
        if: matrix.platform == 'tvos'
        timeout-minutes: 2
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install and verify fixture tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Run UI E2E helper regression tests
        run: python3 -m unittest discover -s scripts -p 'test_ui_e2e.py' -v

      - name: Compute compiled cache identities
        id: cache-toolchains
        timeout-minutes: 2
        continue-on-error: true
        run: |
          apple="$(xcodebuild -version)"
          swift="$(xcrun swift --version)"
          sdks="$(xcodebuild -showsdks)"
          clang="$(xcrun clang --version)"
          os="$(sw_vers -buildVersion)"
          rust="$(rustc -Vv)"
          cargo="$(cargo -V)"
          apple_key="$(printf '%s\n' "$apple" "$swift" "$sdks" "$clang" "$os" | shasum -a 256 | cut -d ' ' -f 1)"
          rust_key="$(printf '%s\n' "$apple_key" "$rust" "$cargo" | shasum -a 256 | cut -d ' ' -f 1)"
          printf 'swift=%s\nrust=%s\n' "$apple_key" "$rust_key" >> "$GITHUB_OUTPUT"

      - name: Restore Rust compiled cache
        id: restore-rust
        if: steps.cache-toolchains.outputs.rust != ''
        uses: actions/cache/restore@v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: target
          key: ui-${{ matrix.platform }}-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchains.outputs.rust }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'CacheServer/RustCacheServer/Cargo.toml', 'CacheServer/RustCacheServer/build.rs', 'CacheServer/RustCacheServer/src/**', 'CacheServer/RustCacheServer/tests/**', 'Sources/TVOSNetPlayerCacheClient/Protos/**', 'scripts/build-cache-server.sh', 'scripts/test-cache-server.sh', 'scripts/lint-rust.sh') }}

      - name: Restore Swift compiled cache
        id: restore-swift
        if: steps.cache-toolchains.outputs.swift != ''
        uses: actions/cache/restore@v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .build
          key: ui-${{ matrix.platform }}-swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchains.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Vendor/**', 'Sources/**', 'Tests/**', 'scripts/test.sh', 'scripts/ui-e2e.py') }}

      - name: Build Rust cache server
        run: scripts/build-cache-server.sh

      - name: Run ${{ matrix.platform }} UI E2E
        env:
          CACHE_SERVER_BINARY: ${{ github.workspace }}/target/release/tvos-net-player-cache-server
          UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/ui-e2e-artifacts/${{ matrix.platform }}
        run: python3 scripts/ui-e2e.py --platform "${{ matrix.platform }}"

      - name: Record compiled cache restore results
        if: always()
        timeout-minutes: 1
        env:
          RUST_OUTCOME: ${{ steps.restore-rust.outcome }}
          RUST_HIT: ${{ steps.restore-rust.outputs.cache-hit }}
          SWIFT_OUTCOME: ${{ steps.restore-swift.outcome }}
          SWIFT_HIT: ${{ steps.restore-swift.outputs.cache-hit }}
        run: |
          printf 'Rust cache restore: outcome=%s exact-hit=%s\n' "$RUST_OUTCOME" "${RUST_HIT:-unavailable}"
          printf 'Swift cache restore: outcome=%s exact-hit=%s\n' "$SWIFT_OUTCOME" "${SWIFT_HIT:-unavailable}"

      - name: Upload bounded UI E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-e2e-artifacts/${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 3

      - name: Save Rust compiled cache
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-rust.outputs.cache-primary-key != '' && steps.restore-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: target
          key: ${{ steps.restore-rust.outputs.cache-primary-key }}

      - name: Save Swift compiled cache
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-swift.outputs.cache-primary-key != '' && steps.restore-swift.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: .build
          key: ${{ steps.restore-swift.outputs.cache-primary-key }}
