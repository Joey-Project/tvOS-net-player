syntax = "proto3";

package tvos_net_player.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "TVOSNetPlayer.Cache.V1";

// Control-plane API for the LAN cache server.
// Media bytes are never sent through gRPC. PlaybackSource.uri must be an HTTP
// URL that AVPlayer can play directly, such as an HLS playlist or MP4 asset.

service ServerService {
  rpc GetServerInfo(GetServerInfoRequest) returns (ServerInfo);
  rpc CheckHealth(CheckHealthRequest) returns (HealthStatus);
  rpc GetBilibiliCredentialStatus(GetBilibiliCredentialStatusRequest) returns (BilibiliCredentialStatus);
  rpc ListBilibiliCredentialProfiles(ListBilibiliCredentialProfilesRequest) returns (ListBilibiliCredentialProfilesResponse);
  rpc StartBilibiliLoginSession(StartBilibiliLoginSessionRequest) returns (BilibiliLoginSession);
  rpc GetBilibiliLoginSession(GetBilibiliLoginSessionRequest) returns (BilibiliLoginSession);
}

service LibraryService {
  rpc ListLibraryItems(ListLibraryItemsRequest) returns (ListLibraryItemsResponse);
  rpc GetLibraryItem(GetLibraryItemRequest) returns (LibraryItem);
  rpc GetPlaybackSource(GetPlaybackSourceRequest) returns (PlaybackSource);
  rpc RescanLibrary(RescanLibraryRequest) returns (RescanLibraryResponse);
}

service TaskService {
  rpc ResolveBilibiliInput(ResolveBilibiliInputRequest) returns (BilibiliResolveResult);
  rpc StartBilibiliResolution(StartBilibiliResolutionRequest) returns (BilibiliResolutionPage);
  rpc ListBilibiliResolutionCandidates(ListBilibiliResolutionCandidatesRequest) returns (BilibiliResolutionPage);
  rpc CreateBilibiliTask(CreateBilibiliTaskRequest) returns (Task);
  rpc CreateBilibiliPlaybackTask(CreateBilibiliPlaybackTaskRequest) returns (Task);
  rpc CreateBilibiliPlaybackTaskV2(CreateBilibiliPlaybackTaskV2Request) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTaskResults(ListTaskResultsRequest) returns (ListTaskResultsResponse);
  rpc WatchTasks(WatchTasksRequest) returns (stream TaskEvent);
  rpc CancelTask(CancelTaskRequest) returns (Task);
}

service CacheService {
  rpc ListCacheRoots(ListCacheRootsRequest) returns (ListCacheRootsResponse);
  rpc GetHlsCacheStatus(GetHlsCacheStatusRequest) returns (HlsCacheStatus);
  rpc ReportPlaybackProgress(ReportPlaybackProgressRequest) returns (ReportPlaybackProgressResponse);
  rpc DeleteLibraryItem(DeleteLibraryItemRequest) returns (DeleteLibraryItemResponse);
}

message GetServerInfoRequest {}

message ServerInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  repeated string media_base_uris = 4;
  repeated ServerCapability capabilities = 5;
}

enum ServerCapability {
  SERVER_CAPABILITY_UNSPECIFIED = 0;
  SERVER_CAPABILITY_BILIBILI_TASKS = 1;
  SERVER_CAPABILITY_HTTP_RANGE = 2;
  SERVER_CAPABILITY_HLS = 3;
  SERVER_CAPABILITY_BONJOUR_DISCOVERY = 4;
  SERVER_CAPABILITY_LIBRARY_ITEM_DELETE = 5;
  SERVER_CAPABILITY_BILIBILI_RESOLVE = 6;
  SERVER_CAPABILITY_BILIBILI_TASK_SELECTION = 7;
  SERVER_CAPABILITY_BILIBILI_CREDENTIAL_STATUS = 8;
  SERVER_CAPABILITY_LAN_TRANSCODING = 9;
  SERVER_CAPABILITY_BILIBILI_CREDENTIAL_PROFILES = 10;
  SERVER_CAPABILITY_BILIBILI_LOGIN_SESSIONS = 11;
  SERVER_CAPABILITY_BILIBILI_PLAYBACK_POLICY = 12;
  SERVER_CAPABILITY_TASK_OUTPUT_V2 = 13;
  SERVER_CAPABILITY_BILIBILI_RESOLUTION_V2 = 14;
}

message CheckHealthRequest {}

message HealthStatus {
  HealthState state = 1;
  string message = 2;
  google.protobuf.Timestamp checked_at = 3;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_SERVING = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_NOT_SERVING = 3;
}

message GetBilibiliCredentialStatusRequest {}

message BilibiliCredentialStatus {
  BilibiliCredentialState state = 1;
  string message = 2;
  bool credential_path_configured = 3;
  bool credential_file_loaded = 4;
  bool web_cookie_present = 5;
  bool access_key_present = 6;
  bool tv_access_key_present = 7;
  string restricted_area = 8;
  uint32 restricted_playurl_proxy_count = 9;
  uint32 restricted_api_proxy_count = 10;
  google.protobuf.Timestamp checked_at = 11;
  string active_profile_id = 12;
  string default_profile_id = 13;
  uint32 profile_count = 14;
  repeated BilibiliCredentialProfile profiles = 15;
}

message ListBilibiliCredentialProfilesRequest {}

message ListBilibiliCredentialProfilesResponse {
  repeated BilibiliCredentialProfile profiles = 1;
  string active_profile_id = 2;
  string default_profile_id = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message BilibiliCredentialProfile {
  string id = 1;
  bool is_default = 2;
  bool is_active = 3;
  bool web_cookie_present = 4;
  bool access_key_present = 5;
  bool tv_access_key_present = 6;
}

message StartBilibiliLoginSessionRequest {
  string profile_id = 1;
  BilibiliLoginMethod method = 2;
}

message GetBilibiliLoginSessionRequest {
  string session_id = 1;
}

message BilibiliLoginSession {
  string id = 1;
  string profile_id = 2;
  BilibiliLoginMethod method = 3;
  BilibiliLoginSessionState state = 4;
  string message = 5;
  string verification_uri = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

enum BilibiliLoginMethod {
  BILIBILI_LOGIN_METHOD_UNSPECIFIED = 0;
  BILIBILI_LOGIN_METHOD_WEB_QR = 1;
}

enum BilibiliLoginSessionState {
  BILIBILI_LOGIN_SESSION_STATE_UNSPECIFIED = 0;
  BILIBILI_LOGIN_SESSION_STATE_UNSUPPORTED = 1;
  BILIBILI_LOGIN_SESSION_STATE_PENDING = 2;
  BILIBILI_LOGIN_SESSION_STATE_READY = 3;
  BILIBILI_LOGIN_SESSION_STATE_EXPIRED = 4;
  BILIBILI_LOGIN_SESSION_STATE_ERROR = 5;
}

enum BilibiliCredentialState {
  BILIBILI_CREDENTIAL_STATE_UNSPECIFIED = 0;
  BILIBILI_CREDENTIAL_STATE_NOT_CONFIGURED = 1;
  BILIBILI_CREDENTIAL_STATE_READY = 2;
  BILIBILI_CREDENTIAL_STATE_DEGRADED = 3;
  BILIBILI_CREDENTIAL_STATE_ERROR = 4;
}

message ListLibraryItemsRequest {
  string page_token = 1;
  int32 page_size = 2;
  LibraryFilter filter = 3;
}

message LibraryFilter {
  repeated LibrarySource sources = 1;
  string search_text = 2;
}

message ListLibraryItemsResponse {
  repeated LibraryItem items = 1;
  string next_page_token = 2;
}

message GetLibraryItemRequest {
  string id = 1;
}

message LibraryItem {
  string id = 1;
  string title = 2;
  string subtitle = 3;
  LibrarySource source = 4;
  string source_id = 5;
  string poster_uri = 6;
  repeated MediaVariant variants = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum LibrarySource {
  LIBRARY_SOURCE_UNSPECIFIED = 0;
  LIBRARY_SOURCE_LOCAL_CACHE = 1;
  LIBRARY_SOURCE_MOUNTED_SMB = 2;
  LIBRARY_SOURCE_BILIBILI = 3;
}

message MediaVariant {
  string id = 1;
  string label = 2;
  PlaybackProtocol protocol = 3;
  string container = 4;
  string video_codec = 5;
  string audio_codec = 6;
  int32 width = 7;
  int32 height = 8;
  int64 bitrate = 9;
  int64 size_bytes = 10;
}

message GetPlaybackSourceRequest {
  string item_id = 1;
  string variant_id = 2;
}

message PlaybackSource {
  string item_id = 1;
  string variant_id = 2;
  PlaybackProtocol protocol = 3;
  string uri = 4;
  google.protobuf.Timestamp expires_at = 5;
}

enum PlaybackProtocol {
  PLAYBACK_PROTOCOL_UNSPECIFIED = 0;
  PLAYBACK_PROTOCOL_HTTP_FILE = 1;
  PLAYBACK_PROTOCOL_HLS = 2;
}

message RescanLibraryRequest {
  repeated string cache_root_ids = 1;
}

message RescanLibraryResponse {
  int32 discovered_item_count = 1;
}

message CreateBilibiliTaskRequest {
  string url_or_id = 1;
  BilibiliDownloadOptions options = 2;
}

message BilibiliDownloadOptions {
  string quality_preference = 1;
  string encoding_preference = 2;
  bool prefer_tv_api = 3;
  bool download_subtitles = 4;
  bool download_danmaku = 5;
  string audio_language = 6;
  BilibiliSubtitleAiPolicy subtitle_ai_policy = 7;
  bool download_cover = 8;
  repeated BilibiliDanmakuFormat danmaku_formats = 9;
}

enum BilibiliSubtitleAiPolicy {
  BILIBILI_SUBTITLE_AI_POLICY_UNSPECIFIED = 0;
  BILIBILI_SUBTITLE_AI_POLICY_INCLUDE = 1;
  BILIBILI_SUBTITLE_AI_POLICY_PREFER_NON_AI = 2;
  BILIBILI_SUBTITLE_AI_POLICY_EXCLUDE_AI = 3;
  BILIBILI_SUBTITLE_AI_POLICY_ONLY_AI = 4;
}

enum BilibiliDanmakuFormat {
  BILIBILI_DANMAKU_FORMAT_UNSPECIFIED = 0;
  BILIBILI_DANMAKU_FORMAT_XML = 1;
  BILIBILI_DANMAKU_FORMAT_ASS = 2;
}

message CreateBilibiliPlaybackTaskRequest {
  string url_or_id = 1;
  BilibiliPlaybackOptions options = 2;
  string selection_id = 3;
  BilibiliTaskSelection selection = 4;
}

message BilibiliPlaybackOptions {
  string quality_preference = 1;
  string encoding_preference = 2;
  bool prefer_tv_api = 3;
  string audio_language = 4;
  BilibiliPlaybackPolicy playback_policy = 5;
}

message BilibiliPlaybackPolicy {
  BilibiliTranscodingPreference transcoding_preference = 1;
  BilibiliCompatibleVariantPreference compatible_variant_preference = 2;
  BilibiliWeakNetworkPreference weak_network_preference = 3;
}

enum BilibiliTranscodingPreference {
  BILIBILI_TRANSCODING_PREFERENCE_UNSPECIFIED = 0;
  BILIBILI_TRANSCODING_PREFERENCE_AUTO = 1;
  BILIBILI_TRANSCODING_PREFERENCE_NEVER = 2;
  BILIBILI_TRANSCODING_PREFERENCE_FORCE = 3;
}

enum BilibiliCompatibleVariantPreference {
  BILIBILI_COMPATIBLE_VARIANT_PREFERENCE_UNSPECIFIED = 0;
  BILIBILI_COMPATIBLE_VARIANT_PREFERENCE_PREFER_COMPATIBLE = 1;
  BILIBILI_COMPATIBLE_VARIANT_PREFERENCE_PREFER_REQUESTED = 2;
}

enum BilibiliWeakNetworkPreference {
  BILIBILI_WEAK_NETWORK_PREFERENCE_UNSPECIFIED = 0;
  BILIBILI_WEAK_NETWORK_PREFERENCE_ADAPTIVE = 1;
  BILIBILI_WEAK_NETWORK_PREFERENCE_HOLD_DOWNGRADE = 2;
  BILIBILI_WEAK_NETWORK_PREFERENCE_AVPLAYER_MANAGED = 3;
}

message ResolveBilibiliInputRequest {
  string url_or_id = 1;
  BilibiliPlaybackOptions options = 2;
}

message BilibiliResolveResult {
  string source = 1;
  string title = 2;
  string source_kind = 3;
  repeated BilibiliResolvedCandidate candidates = 4;
  string default_selection_id = 5;
  bool candidates_truncated = 6;
}

message BilibiliResolvedCandidate {
  string selection_id = 1;
  string title = 2;
  string subtitle = 3;
  string source_kind = 4;
  string content_id = 5;
  uint32 index = 6;
  int64 duration_seconds = 7;
  string cover_uri = 8;
}

message StartBilibiliResolutionRequest {
  string url_or_id = 1;
  BilibiliPlaybackOptions options = 2;
  PageRequest page = 3;
}

message ListBilibiliResolutionCandidatesRequest {
  string session_id = 1;
  PageRequest page = 2;
}

message BilibiliResolutionPage {
  BilibiliResolutionSession session = 1;
  repeated BilibiliResolutionCandidate candidates = 2;
  PageInfo page_info = 3;
}

message BilibiliResolutionSession {
  string id = 1;
  string source = 2;
  string title = 3;
  string source_kind = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  string default_candidate_token = 7;
}

message BilibiliResolutionCandidate {
  string candidate_token = 1;
  string title = 2;
  string subtitle = 3;
  string source_kind = 4;
  BilibiliContentIdentity identity = 5;
  uint32 index = 6;
  int64 duration_seconds = 7;
}

message BilibiliContentIdentity {
  BilibiliContentKind kind = 1;
  uint64 aid = 2;
  string bvid = 3;
  uint64 cid = 4;
  uint64 epid = 5;
}

enum BilibiliContentKind {
  BILIBILI_CONTENT_KIND_UNSPECIFIED = 0;
  BILIBILI_CONTENT_KIND_VIDEO_PAGE = 1;
  BILIBILI_CONTENT_KIND_SEASON_EPISODE = 2;
  BILIBILI_CONTENT_KIND_COLLECTION_ITEM = 3;
}

message CreateBilibiliPlaybackTaskV2Request {
  string session_id = 1;
  BilibiliResolutionSelection selection = 2;
}

message BilibiliResolutionSelection {
  BilibiliResolutionSelectionMode mode = 1;
  repeated string candidate_tokens = 2;
  string range_start_candidate_token = 3;
  string range_end_candidate_token = 4;
}

enum BilibiliResolutionSelectionMode {
  BILIBILI_RESOLUTION_SELECTION_MODE_UNSPECIFIED = 0;
  BILIBILI_RESOLUTION_SELECTION_MODE_SINGLE = 1;
  BILIBILI_RESOLUTION_SELECTION_MODE_MULTIPLE = 2;
  BILIBILI_RESOLUTION_SELECTION_MODE_RANGE = 3;
  BILIBILI_RESOLUTION_SELECTION_MODE_ALL = 4;
}

message BilibiliTaskSelection {
  BilibiliTaskSelectionMode mode = 1;
  repeated string selection_ids = 2;
  uint32 range_start_index = 3;
  uint32 range_end_index = 4;
}

enum BilibiliTaskSelectionMode {
  BILIBILI_TASK_SELECTION_MODE_UNSPECIFIED = 0;
  BILIBILI_TASK_SELECTION_MODE_DEFAULT = 1;
  BILIBILI_TASK_SELECTION_MODE_CURRENT = 2;
  BILIBILI_TASK_SELECTION_MODE_SINGLE = 3;
  BILIBILI_TASK_SELECTION_MODE_MULTIPLE = 4;
  BILIBILI_TASK_SELECTION_MODE_RANGE = 5;
  BILIBILI_TASK_SELECTION_MODE_ALL = 6;
}

message GetTaskRequest {
  string id = 1;
}

// Page tokens are opaque, server-issued values bound to the originating
// request scope and snapshot. Clients must not construct or modify them.
message PageRequest {
  // Zero selects the server default. Servers enforce a method-specific maximum.
  uint32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  // Total number of results in this immutable snapshot, not just this page.
  uint64 total_size = 1;
  string next_page_token = 2;
  // Stable identifier shared by every page read from the same snapshot.
  string snapshot_id = 3;
}

message ListTaskResultsRequest {
  string task_id = 1;
  PageRequest page = 2;
}

message ListTaskResultsResponse {
  repeated TaskResult results = 1;
  PageInfo page_info = 2;
  // Matches TaskOutputSummary.revision for the snapshot being paged.
  uint64 output_revision = 3;
}

message WatchTasksRequest {
  repeated string ids = 1;
}

message TaskEvent {
  Task task = 1;
}

message CancelTaskRequest {
  string id = 1;
}

message Task {
  string id = 1;
  TaskKind kind = 2;
  TaskState state = 3;
  string source = 4;
  string title = 5;
  double progress = 6;
  int64 downloaded_bytes = 7;
  int64 total_bytes = 8;
  string message = 9;
  string library_item_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp finished_at = 13;
  PlaybackSource playback_source = 14;
  BilibiliPlaybackSession playback_session = 15;
  BilibiliTaskSelection bilibili_selection = 16;
  repeated BilibiliTaskResultItem result_items = 17;
  TaskOutputSummary output_summary = 18;
}

// Compact output metadata for task snapshots and watch events. Detailed
// results are read through ListTaskResults.
message TaskOutputSummary {
  // Revisions start at one and increase whenever the output snapshot changes.
  uint64 revision = 1;
  uint64 result_count = 2;
  // Terminal results are succeeded, completed, failed, or cancelled.
  uint64 terminal_result_count = 3;
  // Successful results are in TASK_STATE_SUCCEEDED or TASK_STATE_COMPLETED.
  uint64 successful_result_count = 4;
  uint64 failed_result_count = 5;
  uint64 cancelled_result_count = 6;
  // Counts available artifacts across all results in this revision.
  uint64 available_artifact_count = 7;
  string primary_result_id = 8;
}

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  TASK_KIND_BILIBILI_DOWNLOAD = 1;
  TASK_KIND_LIBRARY_RESCAN = 2;
  TASK_KIND_BILIBILI_PROGRESSIVE_PLAYBACK = 3;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCEL_REQUESTED = 5;
  TASK_STATE_CANCELLED = 6;
  TASK_STATE_PLANNED = 7;
  TASK_STATE_PREPARING = 8;
  TASK_STATE_PLAYABLE = 9;
  TASK_STATE_COMPLETED = 10;
}

message TaskResult {
  string id = 1;
  TaskState state = 2;
  string title = 3;
  string subtitle = 4;
  TaskResultProgress progress = 5;
  TaskProblem problem = 6;
  string library_item_id = 7;
  PlaybackSource playback_source = 8;
  repeated TaskArtifact artifacts = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message TaskResultProgress {
  // Normalized progress in the inclusive range 0...1.
  double fraction = 1;
  int64 completed_bytes = 2;
  int64 total_bytes = 3;
  bool total_bytes_known = 4;
  string phase = 5;
  string message = 6;
}

// Problem messages are safe for clients. Provider-specific machine codes use
// a stable lowercase namespace such as "bilibili.credential_required".
message TaskProblem {
  TaskProblemCategory category = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
}

enum TaskProblemCategory {
  TASK_PROBLEM_CATEGORY_UNSPECIFIED = 0;
  TASK_PROBLEM_CATEGORY_INVALID_REQUEST = 1;
  TASK_PROBLEM_CATEGORY_NOT_FOUND = 2;
  TASK_PROBLEM_CATEGORY_CONFLICT = 3;
  TASK_PROBLEM_CATEGORY_AUTHENTICATION = 4;
  TASK_PROBLEM_CATEGORY_PERMISSION = 5;
  TASK_PROBLEM_CATEGORY_UPSTREAM = 6;
  TASK_PROBLEM_CATEGORY_RESOURCE_LIMIT = 7;
  TASK_PROBLEM_CATEGORY_UNSUPPORTED = 8;
  TASK_PROBLEM_CATEGORY_CANCELLED = 9;
  TASK_PROBLEM_CATEGORY_INTERNAL = 10;
}

message TaskArtifact {
  string id = 1;
  TaskArtifactKind kind = 2;
  TaskArtifactState state = 3;
  string title = 4;
  // A provider-independent format label such as "mp4", "ass", or "json".
  // The resource content_type remains authoritative for HTTP delivery.
  string format = 5;
  // BCP 47 language tag when the artifact has a language.
  string language_tag = 6;
  bool is_ai_generated = 7;
  CacheResourceRef resource = 8;
  TaskProblem problem = 9;
}

enum TaskArtifactKind {
  TASK_ARTIFACT_KIND_UNSPECIFIED = 0;
  TASK_ARTIFACT_KIND_MEDIA = 1;
  TASK_ARTIFACT_KIND_SUBTITLE = 2;
  TASK_ARTIFACT_KIND_TIMED_COMMENTS = 3;
  TASK_ARTIFACT_KIND_COVER_IMAGE = 4;
  TASK_ARTIFACT_KIND_CHAPTERS = 5;
  TASK_ARTIFACT_KIND_METADATA = 6;
  TASK_ARTIFACT_KIND_OTHER = 7;
}

enum TaskArtifactState {
  TASK_ARTIFACT_STATE_UNSPECIFIED = 0;
  TASK_ARTIFACT_STATE_PENDING = 1;
  TASK_ARTIFACT_STATE_AVAILABLE = 2;
  TASK_ARTIFACT_STATE_UNAVAILABLE = 3;
  TASK_ARTIFACT_STATE_DELETED = 4;
}

// A server-owned HTTP resource. The URI may be an absolute HTTP(S) URL or an
// origin-relative path. It must never reveal a local filesystem path, an
// upstream provider URL, or provider authentication material.
message CacheResourceRef {
  string id = 1;
  string uri = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  bool size_known = 5;
  bool supports_byte_ranges = 6;
  string etag = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message BilibiliTaskResultItem {
  string id = 1;
  string selection_id = 2;
  string title = 3;
  string subtitle = 4;
  string source_kind = 5;
  string content_id = 6;
  uint32 index = 7;
  TaskState state = 8;
  string message = 9;
  string library_item_id = 10;
  PlaybackSource playback_source = 11;
  BilibiliPlaybackSession playback_session = 12;
}

message BilibiliPlaybackSession {
  string id = 1;
  string title = 2;
  string content_id = 3;
  string selected_variant_id = 4;
  BilibiliPlaybackVariant selected_variant = 5;
  repeated BilibiliPlaybackVariant variants = 6;
  LanTranscodingPlan transcoding_plan = 7;
  BilibiliPlaybackPolicy effective_policy = 8;
}

message BilibiliPlaybackVariant {
  string id = 1;
  string label = 2;
  string source_kind = 3;
  string container = 4;
  string video_codec = 5;
  string audio_codec = 6;
  int32 width = 7;
  int32 height = 8;
  int64 bitrate = 9;
  int64 size_bytes = 10;
}

message ListCacheRootsRequest {}

message ListCacheRootsResponse {
  repeated CacheRoot roots = 1;
}

message GetHlsCacheStatusRequest {}

message HlsCacheStatus {
  bool eviction_enabled = 1;
  int64 max_bytes = 2;
  int32 high_watermark_percent = 3;
  int32 low_watermark_percent = 4;
  int64 high_watermark_bytes = 5;
  int64 low_watermark_bytes = 6;
  int64 used_bytes = 7;
  int32 completed_session_count = 8;
  HlsCacheEvictionSummary last_eviction = 9;
  HlsWeakNetworkStatus weak_network = 10;
  LanTranscodingStatus transcoding = 11;
  HlsPlaybackProgressStatus playback = 12;
}

message LanTranscodingStatus {
  bool enabled = 1;
  LanTranscodingRuntimeState state = 2;
  string message = 3;
  string profile_id = 4;
  string target_container = 5;
  string target_video_codec = 6;
  string target_audio_codec = 7;
  uint32 max_concurrent_jobs = 8;
  uint32 active_job_count = 9;
}

enum LanTranscodingRuntimeState {
  LAN_TRANSCODING_RUNTIME_STATE_UNSPECIFIED = 0;
  LAN_TRANSCODING_RUNTIME_STATE_DISABLED = 1;
  LAN_TRANSCODING_RUNTIME_STATE_IDLE = 2;
  LAN_TRANSCODING_RUNTIME_STATE_BUSY = 3;
}

message LanTranscodingPlan {
  LanTranscodingPlanState state = 1;
  string profile_id = 2;
  string reason = 3;
  string source_variant_id = 4;
  string target_container = 5;
  string target_video_codec = 6;
  string target_audio_codec = 7;
  PlaybackProtocol output_protocol = 8;
}

enum LanTranscodingPlanState {
  LAN_TRANSCODING_PLAN_STATE_UNSPECIFIED = 0;
  LAN_TRANSCODING_PLAN_STATE_DISABLED = 1;
  LAN_TRANSCODING_PLAN_STATE_NOT_REQUIRED = 2;
  LAN_TRANSCODING_PLAN_STATE_READY = 3;
  LAN_TRANSCODING_PLAN_STATE_UNSUPPORTED = 4;
}

message HlsCacheEvictionSummary {
  string reason = 1;
  int64 started_used_bytes = 2;
  int64 finished_used_bytes = 3;
  int64 target_used_bytes = 4;
  int64 projected_added_bytes = 5;
  int64 evicted_bytes = 6;
  repeated string evicted_session_ids = 7;
  bool target_reached = 8;
  google.protobuf.Timestamp completed_at = 9;
}

message HlsWeakNetworkStatus {
  HlsWeakNetworkState state = 1;
  string message = 2;
  int32 degraded_session_count = 3;
  int32 unhealthy_variant_count = 4;
  int32 retrying_variant_count = 5;
  int32 cache_only_session_count = 6;
  google.protobuf.Timestamp last_changed_at = 7;
}

enum HlsWeakNetworkState {
  HLS_WEAK_NETWORK_STATE_UNSPECIFIED = 0;
  HLS_WEAK_NETWORK_STATE_NORMAL = 1;
  HLS_WEAK_NETWORK_STATE_RETRYING = 2;
  HLS_WEAK_NETWORK_STATE_DEGRADED = 3;
  HLS_WEAK_NETWORK_STATE_CACHE_ONLY = 4;
  HLS_WEAK_NETWORK_STATE_UPSTREAM_FAILED = 5;
}

message ReportPlaybackProgressRequest {
  string playback_uri = 1;
  string library_item_id = 2;
  string variant_id = 3;
  double position_seconds = 4;
  double duration_seconds = 5;
  PlaybackProgressIntent intent = 6;
}

message ReportPlaybackProgressResponse {
  bool accepted = 1;
  string session_id = 2;
  string message = 3;
}

message HlsPlaybackProgressStatus {
  HlsPlaybackActivityState state = 1;
  string message = 2;
  string session_id = 3;
  string library_item_id = 4;
  string variant_id = 5;
  string playback_uri = 6;
  double position_seconds = 7;
  double duration_seconds = 8;
  PlaybackProgressIntent last_intent = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum HlsPlaybackActivityState {
  HLS_PLAYBACK_ACTIVITY_STATE_UNSPECIFIED = 0;
  HLS_PLAYBACK_ACTIVITY_STATE_NONE = 1;
  HLS_PLAYBACK_ACTIVITY_STATE_ACTIVE = 2;
  HLS_PLAYBACK_ACTIVITY_STATE_RECENTLY_STOPPED = 3;
}

enum PlaybackProgressIntent {
  PLAYBACK_PROGRESS_INTENT_UNSPECIFIED = 0;
  PLAYBACK_PROGRESS_INTENT_STARTED = 1;
  PLAYBACK_PROGRESS_INTENT_PLAYING = 2;
  PLAYBACK_PROGRESS_INTENT_SEEK = 3;
  PLAYBACK_PROGRESS_INTENT_PAUSED = 4;
  PLAYBACK_PROGRESS_INTENT_STOPPED = 5;
}

message CacheRoot {
  string id = 1;
  string label = 2;
  CacheRootKind kind = 3;
  string path = 4;
  bool writable = 5;
  int64 free_bytes = 6;
  int64 total_bytes = 7;
}

enum CacheRootKind {
  CACHE_ROOT_KIND_UNSPECIFIED = 0;
  CACHE_ROOT_KIND_LOCAL_DIRECTORY = 1;
  CACHE_ROOT_KIND_MOUNTED_SMB = 2;
}

message DeleteLibraryItemRequest {
  string id = 1;
}

message DeleteLibraryItemResponse {
  bool deleted = 1;
}
